name: Publishing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.6.5)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: refs/tags/${{ inputs.tag }}

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

    - name: Verify release metadata
      run: ./scripts/check-release-version.sh "${{ inputs.tag }}"

    - name: Build
      run: uv build --python 3.12

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-dists
        path: dist/
        retention-days: 1

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
    - name: Retrieve release distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-dists
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (twine 7: metadata 2.5 support)
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
