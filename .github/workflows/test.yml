name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - name: Check skill sync
      run: make check-skills

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

    - name: Install dependencies
      run: |
        uv venv --python ${{ matrix.python-version }}
        source .venv/bin/activate
        uv pip install -e ".[dev]"

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest -v --tb=short

    - name: Run linting
      run: |
        source .venv/bin/activate
        ruff check .
        ruff format --check .

    - name: Build wheel
      if: matrix.python-version == '3.12'
      run: uv build --wheel --python 3.12 --out-dir dist

    - name: Smoke-test installed wheel
      if: matrix.python-version == '3.12'
      run: ./scripts/smoke-installed-wheel.sh dist/*.whl

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

    - name: Install dependencies
      run: |
        uv venv --python 3.12
        source .venv/bin/activate
        uv pip install -e ".[dev]"

    - name: Run pyright
      run: |
        source .venv/bin/activate
        pyright
