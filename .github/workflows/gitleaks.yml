name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read
  security-events: write
  actions: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: DariuszPorowski/github-action-gitleaks@a027585cb1f2780aa441f20f4d0aabf8b1a0d90e # v2
        with:
          config: .gitleaks.toml
          report_format: sarif
          fail: false
          log_level: info

      - name: Upload SARIF to GitHub Code Scanning
        if: steps.gitleaks.outputs.exitcode == 1
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3
        with:
          sarif_file: ${{ steps.gitleaks.outputs.report }}

      - name: Fail if secrets found
        if: steps.gitleaks.outputs.exitcode == 1
        run: |
          echo "::error::Gitleaks detected secrets in the codebase"
          exit 1
