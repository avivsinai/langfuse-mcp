# Publishes server.json to the MCP Registry for an existing release tag.
# Called automatically from release.yml (workflow_call) after the PyPI publish
# job succeeds, and can also be run manually (workflow_dispatch) to (re)publish
# an older tag. The registry validates that the tag's PyPI package README
# contains the `mcp-name` HTML comment (README.md carries it as of the first
# release built from this workflow); a tag published before that comment
# existed on PyPI cannot be registered.
name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.10.2). Requires that tag's PyPI README to contain the mcp-name comment."
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.10.2). Requires that tag's PyPI README to contain the mcp-name comment."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Pinned modelcontextprotocol/registry release. Bump deliberately: re-verify
  # the linux_amd64 checksum against the new release's checksums file (or a
  # fresh download) before changing MCP_PUBLISHER_SHA256.
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  publish:
    name: Publish server.json to MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          if [ "$os" != "linux" ] || [ "$arch" != "amd64" ]; then
            echo "::error::pinned MCP_PUBLISHER_SHA256 is for linux/amd64 only, got ${os}/${arch}" >&2
            exit 1
          fi
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          curl -fsSL -o "$asset" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${asset}"
          echo "${MCP_PUBLISHER_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" mcp-publisher
          rm "$asset"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
